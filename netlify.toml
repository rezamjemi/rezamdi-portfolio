[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Photos and thumbnails never change name, so let browsers cache them.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/thumb/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
